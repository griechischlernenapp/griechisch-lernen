<!doctype html><meta charset="utf-8"><title>Ausmalvorlagen</title>
<style>body{font-family:"Segoe UI",system-ui,sans-serif;background:#f4f1eb;color:#2c2c2a;padding:20px;max-width:1200px;margin:0 auto}
h1{color:#0F6E56}h2{font-size:16px;margin:26px 0 10px;color:#0F6E56}h2 span{color:#8a8880;font-weight:normal}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

.p img{width:100%;height:auto;display:block;border-radius:6px;background:#fff}
